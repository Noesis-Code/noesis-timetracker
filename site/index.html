<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Noèsis</title>
<meta name="description" content="Noèsis : une application pour organiser ses activités, suivre son temps, planifier ses objectifs et avancer en communauté.">
<style>
  :root { --fond: #0b0a0a; --texte: #f3eee8; --sable: #a59e96; --violet: #9c8cc8; --bord: rgba(243, 238, 232, .12); }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--fond); color: var(--texte); font: 17px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { min-height: 100vh; display: flex; flex-direction: column; background: radial-gradient(ellipse at 50% 110%, rgba(156, 140, 200, .28), transparent 55%), var(--fond); }
  main { flex: 1; width: 100%; max-width: 640px; margin: 0 auto; padding: 96px 24px 48px; }
  h1 { margin: 0 0 8px; font-size: 44px; letter-spacing: .02em; }
  .societe { margin: 0 0 40px; color: var(--sable); }
  p { margin: 0 0 24px; }
  .bouton { display: inline-block; padding: 12px 24px; border-radius: 12px; background: var(--violet); color: #15111c; font-weight: 600; text-decoration: none; }
  h2 { margin: 48px 0 8px; font-size: 18px; color: var(--sable); font-weight: 600; }
  a { color: var(--violet); }
  footer { padding: 24px; text-align: center; color: var(--sable); font-size: 14px; border-top: 1px solid var(--bord); }
</style>
</head>
<body>
<main>
  <h1>Noèsis</h1>
  <p class="societe">Compagnie Noèsis inc.</p>
  <p>Noèsis est une application pour organiser ses activités, suivre son temps, planifier ses objectifs et avancer avec une communauté.</p>
  <p><a class="bouton" href="https://web-production-15a4a.up.railway.app">Ouvrir l’application</a></p>
  <h2>Contact</h2>
  <p><a href="mailto:admin@compagnienoesis.com">admin@compagnienoesis.com</a></p>
  <h2>Siège social</h2>
  <p>Montréal, Québec, Canada</p>
</main>
<footer>© 2026 Compagnie Noèsis inc.</footer>
</body>
</html>
