<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Trade Tracker</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="security.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">Trade Tracker<span class="demoPill" id="demoPill" hidden title="Données fictives">démo</span></div>
    <div class="topbarRight">
      <button class="langBtn" id="langBtn" type="button" aria-label="Langue">EN</button>
      <button class="syncPill" id="syncPill" type="button" aria-label="État de la synchronisation"><span class="syncDot"></span><span id="syncPillText">—</span></button>
      <a class="topIconBtn" id="secLink" href="#/security" aria-label="Sécurité du compte" title="Sécurité">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.5-3.2 8-8 9-4.8-1-8-4.5-8-9V6z"/></svg>
      </a>
      <a class="topIconBtn" id="tmtLink" href="https://web-staging-6d1b.up.railway.app" aria-label="Retour à TimeTracker" title="TimeTracker">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      </a>
    </div>
  </header>

  <div id="offlineBar" class="offlineBar" role="status" hidden></div>

  <main id="screen" class="screen" aria-busy="true"></main>

  <nav class="tabbar" id="tabbar" aria-label="Navigation principale"></nav>
</div>

<div id="modalRoot"></div>

<script src="js/i18n.js"></script>
<script src="js/format.js"></script>
<script src="js/prefs.js"></script>
<script src="js/demo-data.js"></script>
<script src="js/data.js"></script>
<script src="js/charts.js"></script>
<script src="js/screen-dashboard.js"></script>
<script src="js/screen-positions.js"></script>
<script src="js/screen-allocation.js"></script>
<script src="js/screen-history.js"></script>
<script src="js/screen-compare.js"></script>
<script src="js/screen-sync.js"></script>
<script src="js/screen-broker.js"></script>
<script src="js/screen-invite.js"></script>
<script src="js/screen-security.js"></script>
<script src="js/app.js"></script>
</body>
</html>
