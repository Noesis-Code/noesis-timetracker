# Application iOS (coque Capacitor). Job build : vérifie la compilation pour le simulateur, sans signature.
# Job testflight (manuel) : archive signée automatiquement avec la clé API App Store Connect (secrets ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8), puis envoi à TestFlight.
# Les fichiers de public/ sont copiés dans le paquet (scripts/prepare-ios.js) ; l'app appelle le serveur de production par son API.
name: iOS
on:
  workflow_dispatch:
  push:
    paths: ['mobile/**', 'scripts/prepare-ios.js', 'public/js/native-shell.js', '.github/workflows/ios.yml']
jobs:
  build:
    runs-on: macos-latest
    env:
      CAP_TARGET: ios
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
        working-directory: mobile
      - run: node scripts/prepare-ios.js
      - run: npx cap sync ios
        working-directory: mobile
      - name: Compilation simulateur sans signature
        working-directory: mobile/ios/App
        run: |
          set -o pipefail
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build | tail -40
      - name: Le paquet contient le site
        run: test -f mobile/ios/App/build/Build/Products/Debug-iphonesimulator/App.app/public/index.html
  testflight:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    env:
      CAP_TARGET: ios
      CAP_SERVER: https://web-production-15a4a.up.railway.app
      TEAM_ID: 8GJ2X78MBT
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
        working-directory: mobile
      - run: node scripts/prepare-ios.js
      - run: npx cap sync ios
        working-directory: mobile
      - name: Clé API App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          test -n "$ASC_KEY_ID" -a -n "$ASC_KEY_P8" -a -n "${{ secrets.ASC_ISSUER_ID }}" || { echo "Secrets ASC_KEY_ID, ASC_ISSUER_ID ou ASC_KEY_P8 absents"; exit 1; }
          mkdir -p "$HOME/.private_keys"
          KEY="$HOME/.private_keys/AuthKey_${ASC_KEY_ID}.p8"
          BODY=$(printf '%s' "$ASC_KEY_P8" | tr -d '\r' | sed -E 's/-----(BEGIN|END)[A-Z ]*-----//g' | tr -d ' \n\t')
          { echo "-----BEGIN PRIVATE KEY-----"; printf '%s' "$BODY" | fold -w 64; echo; echo "-----END PRIVATE KEY-----"; } > "$KEY"
          chmod 600 "$KEY"
          if ! openssl pkey -in "$KEY" -noout 2>/dev/null; then echo "clé illisible ($(wc -l < "$KEY") lignes)"; exit 1; fi
          echo "ASC_KEY_PATH=$HOME/.private_keys/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"
      - name: Archive (signée à l'export)
        working-directory: mobile/ios/App
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO DEVELOPMENT_TEAM="$TEAM_ID" CURRENT_PROJECT_VERSION=$((GITHUB_RUN_NUMBER + 100)) 
            archive | tail -40
      - name: Export de l'ipa
        working-directory: mobile/ios/App
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>destination</key><string>export</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tail -20
          ls "$RUNNER_TEMP/export"
      - name: Envoi à TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: xcrun altool --upload-app --type ios --file "$RUNNER_TEMP/export/App.ipa" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
      - uses: actions/upload-artifact@v4
        with:
          name: noesis-ipa
          path: ${{ runner.temp }}/export/App.ipa
          if-no-files-found: error
